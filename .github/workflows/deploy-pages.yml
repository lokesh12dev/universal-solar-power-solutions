# Build the Next.js site as a static export and publish it to GitHub Pages.
# - Triggers: push to `deploy` (the repo's default branch) + manual runs.
# - Publishing happens only if tests, typecheck AND the build succeed.
# - No secrets are used or exposed: the API routes are parked during the static
#   build (see scripts/build-pages.mjs) because GitHub Pages cannot run them.
# - One-time repo setting: Settings → Pages → Source = "GitHub Actions"
#   (or run: gh api -X POST repos/OWNER/REPO/pages -f build_type=workflow).
name: Deploy to GitHub Pages

on:
  push:
    branches: [deploy]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Canonical URL of the published site (drives sitemap, robots, OG tags).
      NEXT_PUBLIC_SITE_URL: https://lokesh12dev.github.io/universal-solar-power-solutions
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (lockfile-exact)
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build static export
        run: npm run build:pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
